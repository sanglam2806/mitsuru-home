spring.application.name=admin

# Secrets come from environment variables; see .env.example in the repo root.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mitsuru_home}
spring.datasource.username=${DB_USERNAME:mitsuru}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# broker acks/nacks every publish and returns unroutable messages, so OrderProducer can fail the order
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
app.rabbitmq.confirm-timeout-ms=${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}

# HMAC-SHA512 signing key, at least 32 characters
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Single admin account until a users table exists
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
