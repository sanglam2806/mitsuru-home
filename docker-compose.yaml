# Secrets are read from the .env file next to this file; see .env.example.
services:

  postgresql:
    image: postgres:15
    container_name: postgresql
    environment:
      POSTGRES_DB: mitsuru_home
      POSTGRES_USER: ${DB_USERNAME:-mitsuru}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mitsuru} -d mitsuru_home"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # RabbitMQ stores data per node name (rabbit@<hostname>), so the hostname must stay the same
    # across container recreation for the volume's queues and messages to be found again
    hostname: rabbitmq
    # run as the image's rabbitmq user from the start: on rootless Podman the entrypoint otherwise creates
    # .erlang.cookie as root (mode 400) in a fresh volume and the broker fails with "eacces"
    user: "999:999"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  java-admin-service:
    build:
      context: ./admin
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:25-jre}
    container_name: java-admin-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgresql:5432/mitsuru_home
      DB_USERNAME: ${DB_USERNAME:-mitsuru}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  go-email-service:
    build:
      context: ./go-email-service
    container_name: go-email-service
    environment:
      MQ_SERVER: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      ORDER_QUEUE: order.queue
    depends_on:
      rabbitmq:
        condition: service_healthy
volumes:
  postgres_data: #use volumes to persist data outside container lifecycle
  rabbitmq_data: # durable queues and unconsumed messages survive container recreation
